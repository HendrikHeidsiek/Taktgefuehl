<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E4E0EC">
<title>Taktgefühl</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Taktgefühl">
<meta property="og:url" content="{{BASE}}/">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preload" href="/static/young-serif.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Young Serif"; src: url("/static/young-serif.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Hanken Grotesk"; src: url("/static/hanken-grotesk.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

:root {
  --sleeve: #E4E0EC;
  --card: #F3F1F7;
  --ink: #1D1712;
  --ink-soft: #5B4F5E;
  --plum: #6B3FA0;
  --night: #120B24;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  /* title + record + download row + operator line fit the first viewport */
  --panel: min(calc((100svh - 196px) / 1.15), calc(100vw - 32px), 760px);
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--sleeve); color: var(--ink); }
body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  font-weight: 500;
  padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--plum); color: var(--sleeve); }

.inlay { width: var(--panel); display: grid; gap: clamp(10px, 2svh, 22px); }

h1 {
  font-family: "Young Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(44px, calc(var(--panel) * 0.168), 128px);
  line-height: .95;
  letter-spacing: -0.03em;
}

/* The sleeve: a dark square in the app's night colour, the record turning inside it. */
.panel {
  position: relative; width: var(--panel); aspect-ratio: 1;
  display: grid; place-items: center;
  background: var(--night);
  border-radius: 6px;
  box-shadow: 0 2px 4px rgba(18,11,36,.25), 0 18px 60px rgba(18,11,36,.35);
  overflow: hidden;
}
.disc { position: relative; width: 88%; aspect-ratio: 1; }
.disc .grooves { width: 100%; height: 100%; display: block; animation: spin 18s linear infinite; }
.disc .label { position: absolute; inset: 0; display: grid; place-items: center; }
.disc .label svg { width: 30%; height: 30%; }
@keyframes spin { to { transform: rotate(360deg); } }

/* download: an app button, on computers with a QR code for the phone */
.get { display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; }
.get[hidden] { display: none; }
.app {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 9px 18px 9px 9px;
  border-radius: 16px;
  background: var(--card);
  box-shadow: inset 0 0 0 1px rgba(29,23,18,.12), 0 8px 24px -10px rgba(18,11,36,.35);
  color: var(--ink); text-decoration: none;
  transition: box-shadow 200ms ease, transform 200ms var(--ease);
}
.app:hover { box-shadow: inset 0 0 0 1px rgba(107,63,160,.45), 0 10px 28px -10px rgba(18,11,36,.45); transform: translateY(-1px); }
.app:active { transform: translateY(0); }
.app:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }
.app img { width: 46px; height: 46px; border-radius: 11px; display: block; }
.app .t { display: grid; gap: 3px; }
.app b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 19px; line-height: 1.05; }
.app small { font-size: 13px; line-height: 1.25; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.app .dl { width: 18px; height: 18px; margin-left: 4px; color: var(--ink-soft); flex: none; }
.qr { display: none; }
.qr img { width: 58px; height: 58px; padding: 5px; border-radius: 6px; background: #fff; display: block; box-shadow: inset 0 0 0 1px rgba(29,23,18,.08); }
@media (hover: hover) and (pointer: fine) and (min-width: 700px) { .qr { display: block; } }

.op { font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.op span { display: block; text-wrap: balance; }
.op span[hidden] { display: none; }
.op a {
  color: var(--ink);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .22em;
  text-decoration-color: rgba(29,23,18,.35);
  border-radius: 2px;
}
.op a:hover { color: var(--plum); text-decoration-color: currentColor; }
.op a:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* the record slides out of its sleeve, once */
.js .disc { opacity: 0; transform: translateY(14%) scale(.94); }
.js .ready .disc { opacity: 1; transform: none; transition: opacity 700ms var(--ease), transform 1100ms var(--ease); }
.js h1 { opacity: 0; transform: translateY(8px); }
.js .ready h1 { opacity: 1; transform: none; transition: opacity 600ms var(--ease) 300ms, transform 600ms var(--ease) 300ms; }
.js .get, .js .op { opacity: 0; }
.js .ready .get, .js .ready .op { opacity: 1; transition: opacity 600ms var(--ease) 800ms; }

@media (max-width: 640px) {
  :root { --panel: calc(100vw - 32px); }
  h1 { font-size: clamp(44px, 17vw, 110px); }
}
@media (prefers-reduced-motion: reduce) {
  .disc .grooves { animation: none; }
  .js .disc, .js h1 { transform: none; }
  .js .ready .disc, .js .ready h1 { transition: opacity 400ms linear; }
  .app, .app:hover { transform: none; }
}
</style>
</head>
<body>
<main class="inlay" id="inlay">
  <h1>Taktgefühl</h1>
  <div class="panel" aria-hidden="true">
    <div class="disc">
      <svg class="grooves" viewBox="-100 -100 200 200"></svg>
      <div class="label">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#120B24"/><g transform="translate(32 32) scale(.8) translate(-35 -32)"><g fill="#A78BFA"><rect x="12" y="26" width="6" height="12" rx="3"/><rect x="22" y="18" width="6" height="28" rx="3"/><rect x="32" y="10" width="6" height="44" rx="3"/><rect x="42" y="18" width="6" height="28" rx="3"/></g><rect x="52" y="26" width="6" height="12" rx="3" fill="#F0A6CA"/></g></svg>
      </div>
    </div>
  </div>
  <div class="get" id="get">
    <a class="app" href="{{APK}}" download>
      <img src="/static/icon.svg" alt="" width="46" height="46">
      <span class="t">
        <b>Taktgefühl für Android</b>
        <small>{{META}}</small>
      </span>
      <svg class="dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
    </a>
    <figure class="qr" title="Mit dem Handy scannen">
      <img src="/qr/app.svg" alt="QR-Code zum Herunterladen der Android-App" width="58" height="58">
      <figcaption class="sr">Mit dem Handy scannen, um die App herunterzuladen</figcaption>
    </figure>
  </div>
  <p class="op"><span id="app-note">Die App braucht das Passwort dieses Servers.</span>{{OPERATOR}}<span>Quellcode: <a href="https://github.com/HendrikHeidsiek/Taktgefuehl" rel="noopener">github.com/HendrikHeidsiek/Taktgefuehl</a></span></p>
</main>
<script>
(() => {
  document.documentElement.classList.add('js');

  // An APK is of no use on iPhone or iPad.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    document.getElementById('get').hidden = true;
    document.getElementById('app-note').hidden = true;
  }

  // Grooves: rings in phase colours, with a few gaps like track breaks on a record.
  const svg = document.querySelector('.grooves');
  const el = (n, a) => { const e = document.createElementNS('http://www.w3.org/2000/svg', n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.appendChild(el('circle', { r: 99, fill: '#1D1712' }));
  const cols = ['#6B3FA0', '#D9688F', '#D99A2B', '#2F8F7C'];
  for (let i = 0; i < 26; i++) {
    const r = 94 - i * 2.4;
    const c = 2 * Math.PI * r;
    const phase = i < 8 ? 0 : i < 15 ? 1 : i < 18 ? 2 : 3;
    svg.appendChild(el('circle', {
      r, fill: 'none', stroke: cols[phase], 'stroke-width': 1.5,
      'stroke-opacity': (0.35 + 0.65 * ((i * 7) % 5) / 4).toFixed(2),
      'stroke-dasharray': `${(c * (0.55 + ((i * 13) % 7) / 18)).toFixed(1)} ${(c * 0.04).toFixed(1)}`,
      transform: `rotate(${(i * 47) % 360})`
    }));
  }

  requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('inlay').classList.add('ready')));
})();
</script>
</body>
</html>
